<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Team Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #555;
        }
        textarea, input, button {
            display: block;
            width: 100%;
            margin: 5px 0 10px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        textarea:focus, input:focus {
            border-color: #667eea;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        #addSection {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }
        #addSection h3 {
            color: #764ba2;
            margin-bottom: 15px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .btn-secondary:hover {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        .info-text {
            font-size: 14px;
            color: #888;
            margin: 5px 0 10px;
        }
        .team-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Random Team Generator</h1>
        
        <label for="names">📝 Masukkan nama-nama (satu per baris):</label>
        <textarea id="names" rows="8" placeholder="Contoh:
Alice
Bob
Charlie
Diana
Eve
Frank"></textarea>
        
        <label for="numTeams">🔢 Jumlah tim:</label>
        <input type="number" id="numTeams" min="1" value="2">
        
        <label for="teamNames">🏷️ Nama tim (opsional, pisah dengan koma):</label>
        <input type="text" id="teamNames" placeholder="Tim A, Tim B, Tim C">
        <div class="info-text">Kosongkan untuk menggunakan nama default (Tim 1, Tim 2, dst.)</div>
        
        <button onclick="generateTeams()">🚀 Generate Teams</button>
        
        <div id="result"></div>
        
        <!-- Section untuk menambah nama tambahan -->
        <div id="addSection">
            <h3>➕ Tambah Nama Tambahan ke Tim</h3>
            <label for="additionalNames">Masukkan nama-nama tambahan (satu per baris):</label>
            <textarea id="additionalNames" rows="5" placeholder="Contoh:
Grace
Henry"></textarea>
            <button class="btn-secondary" onclick="addNamesToTeams()">📥 Add Names to Teams</button>
        </div>
    </div>

    <script>
        let currentTeams = [];
        let currentTeamNames = [];

        function generateTeams() {
            const namesInput = document.getElementById('names').value.trim();
            const numTeams = parseInt(document.getElementById('numTeams').value);
            const teamNamesInput = document.getElementById('teamNames').value.trim();
            const resultDiv = document.getElementById('result');
            
            // Validasi input
            if (!namesInput) {
                resultDiv.textContent = '⚠️ Masukkan nama-nama terlebih dahulu.';
                return;
            }
            
            if (isNaN(numTeams) || numTeams < 1) {
                resultDiv.textContent = '⚠️ Jumlah tim harus minimal 1.';
                return;
            }
            
            const names = namesInput.split('\n').map(name => name.trim()).filter(name => name);
            
            if (names.length === 0) {
                resultDiv.textContent = '⚠️ Tidak ada nama yang valid.';
                return;
            }
            
            if (names.length < numTeams) {
                resultDiv.textContent = `⚠️ Jumlah nama (${names.length}) harus lebih banyak dari jumlah tim (${numTeams}).`;
                return;
            }
            
            // Ambil nama tim kustom atau gunakan default
            currentTeamNames = teamNamesInput ? teamNamesInput.split(',').map(name => name.trim()).filter(name => name) : [];
            if (currentTeamNames.length < numTeams) {
                for (let i = currentTeamNames.length; i < numTeams; i++) {
                    currentTeamNames.push(`Tim ${i + 1}`);
                }
            }
            
            // Acak nama menggunakan Fisher-Yates shuffle yang lebih baik
            const shuffled = [...names];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            // Bagikan ke tim
            currentTeams = Array.from({ length: numTeams }, () => []);
            shuffled.forEach((name, index) => {
                currentTeams[index % numTeams].push(name);
            });
            
            // Tampilkan hasil
            displayTeams();
            
            // Tampilkan section add
            document.getElementById('addSection').style.display = 'block';
            
            // Scroll ke hasil
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function addNamesToTeams() {
            const additionalInput = document.getElementById('additionalNames').value.trim();
            
            if (!additionalInput) {
                alert('⚠️ Masukkan nama tambahan terlebih dahulu.');
                return;
            }
            
            if (currentTeams.length === 0) {
                alert('⚠️ Generate tim terlebih dahulu sebelum menambah nama.');
                return;
            }
            
            const additionalNames = additionalInput.split('\n').map(name => name.trim()).filter(name => name);
            
            if (additionalNames.length === 0) {
                alert('⚠️ Tidak ada nama tambahan yang valid.');
                return;
            }
            
            // Acak nama tambahan menggunakan Fisher-Yates
            const shuffledAdditional = [...additionalNames];
            for (let i = shuffledAdditional.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledAdditional[i], shuffledAdditional[j]] = [shuffledAdditional[j], shuffledAdditional[i]];
            }
            
            // Tambahkan ke tim secara merata
            shuffledAdditional.forEach((name, index) => {
                currentTeams[index % currentTeams.length].push(name);
            });
            
            // Update hasil
            displayTeams();
            
            // Kosongkan textarea
            document.getElementById('additionalNames').value = '';
            
            // Beri notifikasi
            alert(`✅ ${additionalNames.length} nama berhasil ditambahkan ke tim!`);
        }

        function displayTeams() {
            const resultDiv = document.getElementById('result');
            let output = '';
            let totalMembers = 0;
            
            currentTeams.forEach((team, i) => {
                output += `📋 ${currentTeamNames[i]} (${team.length} anggota):\n`;
                output += team.map(name => `   ${name}`).join('\n');
                output += '\n\n';
                totalMembers += team.length;
            });
            
            output += `━`.repeat(30) + '\n';
            output += `📊 Total anggota: ${totalMembers} orang\n`;
            output += `🏆 Jumlah tim: ${currentTeams.length} tim`;
            
            resultDiv.textContent = output;
        }
    </script>
</body>
</html>
